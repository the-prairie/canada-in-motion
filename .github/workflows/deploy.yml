name: Publish approved public beta
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh verified data candidate]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned application dependencies
        run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r pipeline/requirements.txt
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s pipeline -p 'test_*.py'
      - name: Find previous successful refresh baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh api "repos/${{ github.repository }}/actions/workflows/refresh.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          echo "run=$previous" >> "$GITHUB_OUTPUT"
      - name: Restore previous source counts
        if: steps.baseline.outputs.run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-baseline
          path: data/
          run-id: ${{ steps.baseline.outputs.run }}
          github-token: ${{ github.token }}
      - run: python pipeline/refresh.py
      - name: Refresh licensed BC permit inventory when seven days old
        run: python pipeline/refresh_bcer.py
      - name: Refresh openly licensed context when seven days old
        run: python pipeline/refresh_context.py
      - name: Refresh official monthly oil, gas and electricity activity
        run: python pipeline/refresh_monthly_energy.py
      - name: Refresh observed GDP and official energy scenarios
        run: python pipeline/refresh_economy.py
      - name: Refresh Alberta well counts unless the verified snapshot is less than a day old
        run: python pipeline/refresh_alberta_status.py --max-age-hours 24
      - name: Refresh interprovincial energy trade and physical balances
        run: python pipeline/refresh_energy_flows.py
      - name: Refresh official industry income multipliers
        run: python pipeline/refresh_income_paths.py
      - name: Refresh oil history and reproduce conditional model checks
        run: python pipeline/refresh_dynamic_price.py
      - name: Rebuild conditional provincial price responses
        run: python pipeline/refresh_price_response.py
      - name: Refresh household retail price models and spending references
        run: python pipeline/refresh_household_energy.py
      - name: Refresh GDP and employment inputs and rebuild provincial forecasts
        run: python pipeline/refresh_provincial_forecast.py
      - name: Independently reproduce eligible energy forecast experiments
        run: |
          python - <<'PYTHON'
          import json, subprocess, sys
          with open('data/provincial-forecasts.json') as source:
              evaluation = json.load(source).get('energyEvaluation', {})
          if evaluation.get('status') == 'evaluated':
              subprocess.run([sys.executable, 'tests/review/energy-forecast-independent-audit.py'], check=True)
          elif evaluation.get('status') == 'outside-tested-cutoff':
              print('Energy experiment outside its tested information cutoff; incumbent forecast retained.')
          else:
              raise ValueError('Energy forecast evaluation is missing or has an unknown status')
          PYTHON
      - name: Verify published provincial budget sensitivities
        run: python pipeline/refresh_provincial_impacts.py
      - name: Independently verify guided price models after refresh
        run: |
          python -m pip install --disable-pip-version-check -r tests/review/requirements.txt
          python tests/review/guided-scenario-independent-audit.py
      - name: Require approved beta scope, rights, integrity and freshness
        run: node scripts/beta-release-gate.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
