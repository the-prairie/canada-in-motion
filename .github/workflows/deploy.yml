name: Publish approved public beta
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh verified data candidate]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r pipeline/requirements.txt
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s pipeline -p 'test_*.py'
      - name: Find previous successful refresh baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh api "repos/${{ github.repository }}/actions/workflows/refresh.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          echo "run=$previous" >> "$GITHUB_OUTPUT"
      - name: Restore previous source counts
        if: steps.baseline.outputs.run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-baseline
          path: data/
          run-id: ${{ steps.baseline.outputs.run }}
          github-token: ${{ github.token }}
      - run: python pipeline/refresh.py
      - name: Refresh licensed BC permit inventory when seven days old
        run: python pipeline/refresh_bcer.py
      - name: Refresh openly licensed context when seven days old
        run: python pipeline/refresh_context.py
      - name: Require approved beta scope, rights, integrity and freshness
        run: node scripts/beta-release-gate.mjs
      - run: node scripts/build-public.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
